[package]
name = "now"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.8"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
pico-args = "0.5"
crossterm = "0.27"

[features]
default = []
emoji-sun = ["sunrise"]

[dependencies.sunrise]
version = "1.1"
optional = true
